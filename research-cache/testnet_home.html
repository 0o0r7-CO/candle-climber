<!doctype html>

  <head>
    <!-- The vibe/vibe mark (public/vibevibe-mark.svg): the SVG favicon scales
         crisply; the PNGs are rendered from it for browsers and home screens
         that need bitmaps. ?v=5 busts the previous icons. -->
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=5" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=5" type="image/png" sizes="16x16" />

    <link rel="icon" href="/icon-512.png?v=5" type="image/png" sizes="512x512" />
    <link rel="manifest" href="/site.webmanifest?v=5" />
    <meta charset="UTF-8" />
    <!-- interactive-widget: Chromium resizes the LAYOUT viewport around the
         virtual keyboard / some in-app chrome so position:fixed bottom:0 is
         not buried. iOS Trust Wallet ignores this and needs --lp-vv-bottom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="application-name" content="vibe/vibe" />

    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Matches the SHIPPED surface. The document is pinned data-theme="dark"
         and lib/theme.ts returns "dark" unconditionally, so a light theme-color
         painted browser chrome that never matched the app underneath it.
         #101214 is --sp-app-bg in the dark set. -->
    <meta name="theme-color" content="#101214" />
    <link rel="canonical" href="https://testnet.vibevibe.fun/" />
    <!-- Share metadata (Open Graph + Twitter/X cards). Crawlers read this
         static head, never the app, so the identity lives here: the
         vibe/vibe name and the share card (public/og-image.png, 1200x630):
         the header lockup (public/vibevibe-header-lockup.svg, the chef hat
         beside the wordmark) centered on #0c0f08, the founder's banner
         (2026-09-29). Absolute image URL: link previewers do not resolve
         relative paths; the ?v= changes with the image so a previewer that
         cached the old card fetches the new one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vibe/vibe" />
    <meta property="og:title" content="vibe/vibe · Robinhood Chain Testnet" />
    <meta

    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The vibe/vibe chef-hat logo beside the vibe/vibe wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="vibe/vibe · Robinhood Chain Testnet" />

      name="twitter:description"
      content="Discover, test-trade and launch tokens on Robinhood Chain Testnet. Testnet only. No real funds."

    <!-- Self-hosted latin-subset variable fonts (Spark Loops set). Kept self-hosted
         on the web too: no third-party font host, no FOUT dependency. -->
    <!-- Preload ONLY the faces that paint above the fold in the shipped dark
         theme (measured, not assumed: Instrument Sans + JetBrains Mono carry
         the whole first screen, Clash Display 600 the H1/wordmark — Geist and
         Space Grotesk never load at all). Without these the woff2s sit behind
         a two-hop chain (html -> fonts.css -> font) and every cold visit
         flashes fallback text. `crossorigin` is required even same-origin:
         font fetches are CORS-mode, and a mismatched preload double-fetches. -->
    <link rel="preload" href="/fonts/instrumentsans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clashdisplay-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- @font-face rules INLINED (was <link href="/fonts/fonts.css">): the
         sheet was ~1 kB of render-blocking CSS costing a full request + cold
         PoP MISS on every first paint. Inlining is CSP-clean (style-src allows
         'unsafe-inline'). URLs are root-absolute here — the standalone sheet
         at public/fonts/fonts.css uses relative URLs and stays available for
         non-web consumers; keep the two in sync when faces change.
         Faces: UI = Instrument Sans · mono = JetBrains Mono · display = Clash
         Display (ITF Free Font License via Fontshare; self-hosted latin
         subsets, variable weight ranges where available). -->
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/instrumentsans-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/jetbrainsmono-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Clash Display';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/clashdisplay-500-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Clash Display';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/clashdisplay-600-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Clash Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/clashdisplay-700-latin.woff2') format('woff2');
      }
    </style>
    <title>vibe/vibe · Robinhood Chain Testnet</title>
    <!-- Boot-waterfall fix (scale program 6.1, teardown T06): the live
         runtime's no-store /config read used to start only once the module
         graph had reached the bootstrap chunk — three hops and 1.5–1.85 s
         after navigation on a warm load. This classic script issues THE SAME
         request at parse time (URL, method, headers, cache mode and
         credentials match SeedifyReadClient.config) and parks the Response
         promise for src/integrations/live/configPrestart.ts to adopt exactly
         once; nothing is decoded here and every later config read still
         issues its own request. Gated through the Vite env replacement in the
         ATTRIBUTE so the script text stays byte-identical in every mode: one
         CSP hash covers dev, preview and Pages (vite.config.ts computes it
         from this file; public/_headers carries it by hand and
         scripts/check-production-build.mjs fails the build when they drift).
         Skipped on the public /spark-burns and /vibe-vibers surfaces, which never
         boot the live runtime.
         On `/` only, the same script also parks Discover's first V6 read, the
         first page of the V6 index (pre-launch fix PF-4b): it depends on nothing
         but the chain id and used to leave ~4 s after navigation, behind /config
         and three chunk waves. src/integrations/live/v6LaunchesPrestart.ts adopts
         it once, age-bounded, through the client's own schema. -->
    <script data-live-config-prestart="live">
      (function () {
        var script = document.currentScript;
        if (!script || script.getAttribute("data-live-config-prestart") !== "live") return;
        if (/^\/(spark-burns|vibers|vibe-vibers)\/?$/.test(location.pathname)) return;
        if (/^\/vibe-vibers\/for-raiders(?:\/|\.html)?$/.test(location.pathname)) return;
        var park = function (key, url, init) {
          var controller = new AbortController();
          init.signal = controller.signal;
          var response = fetch(url, init);
          response.catch(function () {});
          window[key] = { startedAt: Date.now(), controller: controller, response: response };
        };
        park("__seedifyLiveConfigPrestart", "/api/v1/chains/46630/config", {
          method: "GET",
          headers: { accept: "application/json", "x-seedify-config-split": "5" },
          cache: "no-store",
          credentials: "omit"
        });
        if (location.pathname !== "/") return;
        park("__seedifyV6LaunchesPrestart", "/api/v1/chains/46630/v6/launches?limit=50", {
          method: "GET",
          headers: { accept: "application/json" },
          credentials: "omit"
        });
      })();
    </script>
